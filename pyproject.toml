[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-processing-prototype"
version = "0.1.0"
description = "Image analysis and processing prototype: pick a mode, upload an image, view the result."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
    "exifread==3.0.0",
    "pillow==11.1.0",
    "numpy==2.0.2",
    "opencv-python-headless==4.11.0.86",
    "torch==2.14.0",
    "cellpose==3.1.1.3",
    # fastremap (a cellpose dependency) imports "packaging" at runtime but does not declare it.
    "packaging==24.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app = ["ui/templates/*.html", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
